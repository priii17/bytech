<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crear nueva contraseña</title>
    <link rel="stylesheet" href="../css/logins.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  </head>
  <body>
    <div class="formulario">
      <img src="../img/logohosp.png" />
      <h1>Nueva cotraseña</h1>
      <form method="post" id="registro" novalidate>
        <div class="campo">
          <label>Contraseña</label>
          <input class="input-contrasenia" type="password" id="contrasenia" placeholder="Ingrese una contraseña" />
          <span class="icono"><i class="fa-solid fa-lock"></i></span>
          <span class="i-contrasenia"><i class="fa-solid fa-eye"></i></span>
        </div>

        <div class="campo">
          <label>Confirmar contraseña</label>
          <input class="input-contrasenia" type="password" id="contrasenia2" placeholder="Confirmar contraseña" />
          <span class="icono"><i class="fa-solid fa-lock"></i></span>
          <span class="i-contrasenia"><i class="fa-solid fa-eye"></i></span>
        </div>
        <input type="submit" value="Confirmar nueva contraseña" />
        <p class="errores"></p>
      </form>
    </div>
    <script src="../js/mostrar.js"></script>
    <script src="../js/validarnuevacontrasenia.js"></script>
  </body>
</html>
