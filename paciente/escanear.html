<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Escanear código QR</title>

    <!-- biblioteca que permite escanear qrs -->
    <script src="https://unpkg.com/html5-qrcode"></script>

    <link rel="stylesheet" href="../css/usuario.css" />
  </head>

  <body>
    <header class="barra-navegador">
      <nav>
        <ul>
          <li><a href="index_paciente.html">Inicio</a></li>
          <li><a href="escanear.html">Escanear</a></li>
          <li><a href="../encuestas/encuestas_usuario.html">Encuestas</a></li>
        </ul>
      </nav>
    </header>
    <main class="main-paciente">
      <div class="contenedor-escaner">
        <h2 class="titulo">Escanear código QR</h2>
        <p class="message">Haga click en el boton para poder escanear.</p>

        <!-- inicia el escaner -->
        <button id="btnEscanear" class="btn">📷 Escanear</button>

        <!-- contenedor de la cámara -->
        <div id="reader"></div>

        <!-- resultado del escaneo -->
        <div id="resultado">
          <h3>Resultado del escaneo</h3>

          <!-- Contenido obtenido del qr-->
          <p id="textoQR"></p>

          <a id="enlaceQR" href="#" target="_blank" rel="noopener noreferrer">
            <button type="button" class="btn">Abrir documento</button>
          </a>

          <br />

          <button id="btnOtra" class="btn">Escanear de nuevo</button>
        </div>
      </div>
    </main>
    <footer>
      <p>&copy; 2026 Bytech .Todos los derechos reservados.</p>
      <p>hospitaldeclinicas@gmail.com</p>
      <p>1953/0800 1953</p>
    </footer>
    <script src="../js/escanear.js"></script>
  </body>
</html>
