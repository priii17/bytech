<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Iniciar sesión</title>

    <link rel="stylesheet" href="../css/logins.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  </head>

  <body>
    <main class="pagina_login">
      <section class="login" aria-labelledby="titulo-login">
        <div class="login_imagen">
          <img class="hospital" src="../img/hospital-de-clinicas2.jpg" />
        </div>

        <div class="login_panel">
          <p class="nombreHospital">Hospital de Clínicas</p>

          <h1 class="titulo" id="titulo-login">Iniciar sesión</h1>

          <p class="subtitulo">Ingresa a tu cuenta</p>

          <form class="form" id="form_inicio" validat>
            <label>
              <input id="usuario" name="usuario" type="text" placeholder=" " required />
              <span>Usuario</span>
            </label>

            <label>
              <input id="contrasenia" name="contrasenia" type="password" placeholder=" " minlength="8" required />
              <span>Contraseña</span>
            </label>

            <button class="boton" type="submit">Iniciar sesión</button>
          </form>

          <p class="pie">
            ¿No tienes una cuenta?
            <a href="registrofunadm.html">Regístrate</a>
          </p>

          <p class="pie">
            <a href="../paciente/index_paciente.html">Ingresar como paciente</a>
          </p>
        </div>
      </section>
    </main>

    <script src="../js/inicioSesion.js"></script>
  </body>
</html>
