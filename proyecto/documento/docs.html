    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  </head>

  <body>
    <div class="contenedor1">
      <header>
        <nav>
          <div class="barra-izquierda">
            <a href="../conexion/index.html" class="tooltip">
              <span id="inicio"> <i class="fa-solid fa-house"> </i> </span> <span class="tooltiptext"> Inicio </span>
            </a>

            <a href="./docs.html" class="tooltip"> <span id="carpeta"> Documentos </span> </a>
            <a href="../traslado/Traslado.html" class="tooltip"> <span id="traslados"> Traslados </span></a>

            <a href="#Encuestas" class="tooltip"> <span id="encuestas"> Encuestas</span> </a>

            <a href="../traslado/registro_elementos.html" class="tooltip"> <span id="crear"> Registro </span> </a>

            <a href="../ayuda/ayuda.html" class="tooltip"> <span id="ayuda"> Ayuda</span> </a>

          <div class="barra-derecha">

              <span id="perfil"> <i class="fa-solid fa-circle-user"></i></span> <span class="tooltiptext"> Perfil </span></a>
            
          </div>
        </nav>
      </header>
      <main>
        <div id="icono-doc">
          <i class="fa-regular fa-folder-closed"></i>
        </div>

        <div class="busqueda">
          <input type="text" placeholder="Buscar documentos..." />
          <button id="eliminar"><i class="fa-solid fa-xmark"></i></button>
          <button id="lupa"><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>

        <div id="lista-documentos"></div>

        <script>
          fetch("../php/verdocumento.php")
            .then((respuesta) => respuesta.text())
            .then((datos) => {
              document.getElementById("lista-documentos").innerHTML = datos;
            })
            .catch((error) => {
              console.log("Error:", error);
            });
        </script>
        <div class="boton">
          <button id="subir">
            <i class="fa-solid fa-plus"></i>
          </button>
          <span class="texto">Subir documento</span>
        </div>
      </main>

    </div>
