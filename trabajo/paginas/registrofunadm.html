<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro Funcionario</title>
  </head>

  <body>
    <div class="formulario">
      <h1>Registrarse</h1>

      <form id="registro">

        <div class="campo-nombre">
          <label>Nombre completo</label>
          <input type="text" id="nombre" name="nombre" required />
        </div>

        <div class="campo-email">
          <label>Gmail</label>
          <input type="email" id="email" name="email" required />
        </div>

        <div class="campo-cedula">
          <label>Cédula de Identidad</label>
          <input type="text"  id="cedula" name="cedula" required />
        </div>

        <div class="campo-nacimiento">
          <label>Fecha de Nacimiento</label>
          <input type="date" id="fecha" name="fecha" required />
        </div>

        <div class="campo-contraseña">
          <label>Contraseña</label>
          <input type="password" id="contrasenia" name="contrasenia" required />
        </div>

        <div class="campo-contraseña">
          <label>Confirmar contraseña</label>
          <input type="password" required />
        </div>
        <div class="campo-codigo">
          <label>Código de Verificación</label>
          <input type="number" id="codigo" name="codigo" required />
        </div>
        <input type="submit" value="Registrarse" id="boton" name="boton"/>
        <div class="Iniciar Sesión">¿Ya tienes una cuenta? <a href="login.html">Iniciar Sesión</a></div>
      </form>
    </div>
    <script src="../js/registroUsuario.js"></script>
  </body>
</html>
